name: Sauti Yetu verification

on:
  push:
    branches:
      - 'feature/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  frontend-build:
    name: Preserve and build the existing frontend
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Build frontend
        run: npm run build

  backend-tests:
    name: Backend tests and PostgreSQL migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sauti_yetu_test
          POSTGRES_USER: sauti_yetu
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sauti_yetu -d sauti_yetu_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      PORT: 4000
      TRUST_PROXY: "false"
      DATABASE_SSL: "false"
      DATABASE_URL: postgresql://sauti_yetu:ci-only-password@localhost:5432/sauti_yetu_test
      MIGRATION_DATABASE_URL: postgresql://sauti_yetu:ci-only-password@localhost:5432/sauti_yetu_test
      GUARDIAN_PHONE_ENCRYPTION_KEY_BASE64: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      GUARDIAN_PHONE_LOOKUP_PEPPER: ci-guardian-lookup-pepper-32-bytes
      AUDIT_FINGERPRINT_PEPPER: ci-audit-fingerprint-pepper-32-bytes
      GUARDIAN_OTP_PEPPER: ci-guardian-otp-pepper-32-bytes-test
      CONSENT_NOTICE_VERSION: ci-test-v1
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install backend dependencies
        run: npm install --no-audit --no-fund
      - name: Check JavaScript syntax
        run: npm run check
      - name: Run synthetic unit tests
        run: npm test
      - name: Apply migrations to disposable PostgreSQL
        run: node src/migrate-cli.js
      - name: Verify schema objects
        run: |
          node --input-type=module <<'NODE'
          import pg from 'pg';
          const pool = new pg.Pool({ connectionString: process.env.DATABASE_URL });
          try {
            const result = await pool.query(`
              SELECT
                to_regclass('public.users') AS users_table,
                to_regclass('public.guardian_consents') AS consent_table,
                to_regclass('public.auth_sessions') AS sessions_table,
                to_regclass('public.guardian_consent_reviews') AS consent_reviews_table,
                to_regclass('public.guardian_phone_verification_challenges') AS guardian_otp_table,
                to_regclass('public.stakeholder_updates') AS stakeholder_updates_table,
                to_regclass('public.public_concern_summary') AS public_view,
                to_regclass('public.stakeholder_resolution_summary') AS stakeholder_view,
                to_regclass('public.concerns_submitter_created_idx') AS concerns_owner_index,
                (SELECT count(*) FROM pg_constraint WHERE conname = 'concerns_private_content_encrypted_check') AS encrypted_concern_constraint,
                (SELECT count(*) FROM pg_constraint WHERE conname = 'concerns_public_projection_redacted_check') AS redacted_public_projection_constraint,
                (SELECT count(*) FROM pg_constraint WHERE conname = 'concerns_safeguarding_referrals_private_check') AS safeguarding_privacy_constraint,
                (SELECT count(*) FROM schema_migrations) AS migration_count
            `);
            const row = result.rows[0];
            process.stdout.write(JSON.stringify(row) + '\\n');
            if (
              !row.users_table ||
              !row.consent_table ||
              !row.sessions_table ||
              !row.consent_reviews_table ||
              !row.guardian_otp_table ||
              !row.stakeholder_updates_table ||
              !row.public_view ||
              !row.stakeholder_view ||
              !row.concerns_owner_index ||
              Number(row.encrypted_concern_constraint) !== 1 ||
              Number(row.redacted_public_projection_constraint) !== 1 ||
              Number(row.safeguarding_privacy_constraint) !== 1 ||
              Number(row.migration_count) !== 11
            ) {
              throw new Error('One or more expected schema objects are missing');
            }
            process.stdout.write(JSON.stringify(row) + '\\n');
          } finally {
            await pool.end();
          }
          NODE
      - name: Verify session revocation triggers
        run: |
          node --input-type=module <<'NODE'
          import pg from 'pg';
          const pool = new pg.Pool({ connectionString: process.env.DATABASE_URL });
          const fail = message => { throw new Error(message); };
          try {
            const adultResult = await pool.query(`
              INSERT INTO users (
                full_name, full_name_ciphertext, role, status, county,
                school, school_ciphertext, email_normalized, password_hash
              ) VALUES (
                NULL, $1, 'coordinator', 'active', 'Mombasa',
                NULL, NULL, 'ci-coordinator@example.test', '$argon2id$synthetic'
              )
              RETURNING id
            `, [Buffer.from('synthetic encrypted adult identity')]);
            const adultId = adultResult.rows[0].id;

            const adultSession = await pool.query(`
              INSERT INTO auth_sessions (user_id, token_hash, csrf_token_hash, expires_at)
              VALUES ($1, $2, $3, now() + interval '8 hours')
              RETURNING id
            `, [adultId, Buffer.alloc(32, 11), Buffer.alloc(32, 12)]);
            await pool.query(
              "UPDATE users SET password_hash = '$argon2id$changed' WHERE id = $1",
              [adultId]
            );
            let check = await pool.query(
              'SELECT revoked_at IS NOT NULL AS revoked FROM auth_sessions WHERE id = $1',
              [adultSession.rows[0].id]
            );
            if (!check.rows[0].revoked) fail('Credential change did not revoke adult sessions');

            const childResult = await pool.query(`
              INSERT INTO users (
                full_name, full_name_ciphertext, role, status, age,
                school, school_ciphertext, county, ward,
                guardian_phone_lookup_hash, guardian_phone_ciphertext, passphrase_hash
              ) VALUES (
                NULL, $1, 'public_child', 'active', 14,
                NULL, $2, 'Mombasa', 'Nyali', $3, $4, '$argon2id$synthetic-child'
              )
              RETURNING id
            `, [
              Buffer.from('synthetic encrypted child identity'),
              Buffer.from('synthetic encrypted school'),
              Buffer.alloc(32, 21),
              Buffer.from('synthetic encrypted guardian phone')
            ]);
            const childId = childResult.rows[0].id;

            const consentResult = await pool.query(`
              INSERT INTO guardian_consents (
                child_user_id, guardian_name, guardian_name_ciphertext,
                guardian_phone_lookup_hash, guardian_phone_ciphertext,
                consent_text_version, status
              ) VALUES (
                $1, NULL, $2, $3, $4, 'ci-test-v1', 'pending'
              )
              RETURNING id
            `, [
              childId,
              Buffer.from('synthetic encrypted guardian name'),
              Buffer.alloc(32, 21),
              Buffer.from('synthetic encrypted guardian phone')
            ]);
            const consentReview = await pool.query(`
              INSERT INTO guardian_consent_reviews (
                consent_id, reviewed_by, decision, verification_method, evidence_reference
              ) VALUES ($1, $2, 'approved', 'verified_call', 'ci-session-review-0001')
              RETURNING id
            `, [consentResult.rows[0].id, adultId]);
            await pool.query(`
              UPDATE guardian_consents
              SET status = 'approved', reviewed_by = $2,
                  reviewed_at = now(), granted_at = now(), latest_review_id = $3
              WHERE id = $1
            `, [consentResult.rows[0].id, adultId, consentReview.rows[0].id]);

            const childSession = await pool.query(`
              INSERT INTO auth_sessions (user_id, token_hash, csrf_token_hash, expires_at)
              VALUES ($1, $2, $3, now() + interval '8 hours')
              RETURNING id
            `, [childId, Buffer.alloc(32, 31), Buffer.alloc(32, 32)]);
            await pool.query(
              "UPDATE guardian_consents SET status = 'withdrawn', withdrawn_at = now() WHERE id = $1",
              [consentResult.rows[0].id]
            );
            check = await pool.query(
              'SELECT revoked_at IS NOT NULL AS revoked FROM auth_sessions WHERE id = $1',
              [childSession.rows[0].id]
            );
            if (!check.rows[0].revoked) fail('Guardian consent withdrawal did not revoke child sessions');

            let deleteBlocked = false;
            try {
              await pool.query('DELETE FROM guardian_consents WHERE id = $1', [consentResult.rows[0].id]);
            } catch (error) {
              deleteBlocked = String(error.message).includes('cannot be deleted');
            }
            if (!deleteBlocked) fail('Guardian consent record deletion was not blocked');
            process.stdout.write('Session revocation triggers passed\\n');
          } finally {
            await pool.end();
          }
          NODE
      - name: Verify guardian consent review integrity
        run: |
          node --input-type=module <<'NODE'
          import pg from 'pg';
          const pool = new pg.Pool({ connectionString: process.env.DATABASE_URL });
          const fail = message => { throw new Error(message); };
          const encrypted = label => Buffer.from('synthetic encrypted ' + label);
          try {
            const coordinator = await pool.query(`
              INSERT INTO users (
                full_name, full_name_ciphertext, role, status, county,
                school, school_ciphertext, email_normalized, password_hash
              ) VALUES (
                NULL, $1, 'coordinator', 'active', 'Mombasa',
                NULL, NULL, 'consent-coordinator@example.test', '$argon2id$synthetic'
              )
              RETURNING id
            `, [encrypted('coordinator')]);
            const coordinatorId = coordinator.rows[0].id;

            const child = await pool.query(`
              INSERT INTO users (
                full_name, full_name_ciphertext, role, status, age,
                school, school_ciphertext, county, ward,
                guardian_phone_lookup_hash, guardian_phone_ciphertext, passphrase_hash
              ) VALUES (
                NULL, $1, 'public_child', 'pending', 14,
                NULL, $2, 'Mombasa', 'Nyali', $3, $4, '$argon2id$synthetic-child'
              )
              RETURNING id
            `, [
              encrypted('child'),
              encrypted('school'),
              Buffer.alloc(32, 41),
              encrypted('guardian phone')
            ]);
            const childId = child.rows[0].id;

            const consent = await pool.query(`
              INSERT INTO guardian_consents (
                child_user_id, guardian_name, guardian_name_ciphertext,
                guardian_phone_lookup_hash, guardian_phone_ciphertext,
                consent_text_version, status
              ) VALUES ($1, NULL, $2, $3, $4, 'ci-test-v1', 'pending')
              RETURNING id
            `, [
              childId,
              encrypted('guardian name'),
              Buffer.alloc(32, 41),
              encrypted('guardian phone')
            ]);
            const consentId = consent.rows[0].id;

            let directApprovalBlocked = false;
            try {
              await pool.query(`
                UPDATE guardian_consents
                SET status = 'approved', reviewed_by = $2,
                    reviewed_at = now(), granted_at = now()
                WHERE id = $1
              `, [consentId, coordinatorId]);
            } catch (error) {
              directApprovalBlocked = String(error.message).includes('recorded coordinator review');
            }
            if (!directApprovalBlocked) fail('Consent was approved without a recorded review');

            const review = await pool.query(`
              INSERT INTO guardian_consent_reviews (
                consent_id, reviewed_by, decision, verification_method, evidence_reference
              ) VALUES ($1, $2, 'approved', 'verified_call', 'ci-review-reference-0001')
              RETURNING id
            `, [consentId, coordinatorId]);
            await pool.query(`
              UPDATE guardian_consents
              SET status = 'approved', reviewed_by = $2,
                  reviewed_at = now(), granted_at = now(), latest_review_id = $3
              WHERE id = $1
            `, [consentId, coordinatorId, review.rows[0].id]);

            let reviewMutationBlocked = false;
            try {
              await pool.query(
                "UPDATE guardian_consent_reviews SET evidence_reference = 'changed-reference-0001' WHERE id = $1",
                [review.rows[0].id]
              );
            } catch (error) {
              reviewMutationBlocked = String(error.message).includes('append-only');
            }
            if (!reviewMutationBlocked) fail('Guardian consent review history was mutable');

            const stakeholder = await pool.query(`
              INSERT INTO users (
                full_name, full_name_ciphertext, role, status,
                school, school_ciphertext, email_normalized, password_hash
              ) VALUES (
                NULL, $1, 'stakeholder', 'active',
                NULL, NULL, 'consent-stakeholder@example.test', '$argon2id$synthetic'
              )
              RETURNING id
            `, [encrypted('stakeholder')]);
            const secondChild = await pool.query(`
              INSERT INTO users (
                full_name, full_name_ciphertext, role, status, age,
                school, school_ciphertext, county, ward,
                guardian_phone_lookup_hash, guardian_phone_ciphertext, passphrase_hash
              ) VALUES (
                NULL, $1, 'public_child', 'pending', 13,
                NULL, $2, 'Mombasa', 'Kisauni', $3, $4, '$argon2id$synthetic-child-2'
              )
              RETURNING id
            `, [
              encrypted('second child'),
              encrypted('second school'),
              Buffer.alloc(32, 42),
              encrypted('second guardian phone')
            ]);
            const secondConsent = await pool.query(`
              INSERT INTO guardian_consents (
                child_user_id, guardian_name, guardian_name_ciphertext,
                guardian_phone_lookup_hash, guardian_phone_ciphertext,
                consent_text_version, status
              ) VALUES ($1, NULL, $2, $3, $4, 'ci-test-v1', 'pending')
              RETURNING id
            `, [
              secondChild.rows[0].id,
              encrypted('second guardian name'),
              Buffer.alloc(32, 42),
              encrypted('second guardian phone')
            ]);
            const invalidReview = await pool.query(`
              INSERT INTO guardian_consent_reviews (
                consent_id, reviewed_by, decision, verification_method, evidence_reference
              ) VALUES ($1, $2, 'approved', 'document_review', 'ci-review-reference-0002')
              RETURNING id
            `, [secondConsent.rows[0].id, stakeholder.rows[0].id]);

            let stakeholderApprovalBlocked = false;
            try {
              await pool.query(`
                UPDATE guardian_consents
                SET status = 'approved', reviewed_by = $2,
                    reviewed_at = now(), granted_at = now(), latest_review_id = $3
                WHERE id = $1
              `, [secondConsent.rows[0].id, stakeholder.rows[0].id, invalidReview.rows[0].id]);
            } catch (error) {
              stakeholderApprovalBlocked = String(error.message).includes('active coordinator');
            }
            if (!stakeholderApprovalBlocked) fail('Stakeholder was able to approve guardian consent');

            const distantChild = await pool.query(`
              INSERT INTO users (
                full_name, full_name_ciphertext, role, status, age,
                school, school_ciphertext, county, ward,
                guardian_phone_lookup_hash, guardian_phone_ciphertext, passphrase_hash
              ) VALUES (
                NULL, $1, 'public_child', 'pending', 13,
                NULL, $2, 'Kilifi', 'Mtwapa', $3, $4, '$argon2id$synthetic-child-3'
              )
              RETURNING id
            `, [
              encrypted('distant child'),
              encrypted('distant school'),
              Buffer.alloc(32, 43),
              encrypted('distant guardian phone')
            ]);
            const distantConsent = await pool.query(`
              INSERT INTO guardian_consents (
                child_user_id, guardian_name, guardian_name_ciphertext,
                guardian_phone_lookup_hash, guardian_phone_ciphertext,
                consent_text_version, status
              ) VALUES ($1, NULL, $2, $3, $4, 'ci-test-v1', 'pending')
              RETURNING id
            `, [
              distantChild.rows[0].id,
              encrypted('distant guardian name'),
              Buffer.alloc(32, 43),
              encrypted('distant guardian phone')
            ]);
            const distantReview = await pool.query(`
              INSERT INTO guardian_consent_reviews (
                consent_id, reviewed_by, decision, verification_method, evidence_reference
              ) VALUES ($1, $2, 'approved', 'in_person', 'ci-review-reference-0003')
              RETURNING id
            `, [distantConsent.rows[0].id, coordinatorId]);

            let countyApprovalBlocked = false;
            try {
              await pool.query(`
                UPDATE guardian_consents
                SET status = 'approved', reviewed_by = $2,
                    reviewed_at = now(), granted_at = now(), latest_review_id = $3
                WHERE id = $1
              `, [distantConsent.rows[0].id, coordinatorId, distantReview.rows[0].id]);
            } catch (error) {
              countyApprovalBlocked = String(error.message).includes('coordinator county must match');
            }
            if (!countyApprovalBlocked) fail('Coordinator approved consent outside the assigned county');

            process.stdout.write('Guardian consent review integrity passed\\n');
          } finally {
            await pool.end();
          }
          NODE
      - name: Verify guardian OTP PostgreSQL integrity
        run: node scripts/verify-guardian-otp-postgres.js
      - name: Smoke-test API health endpoints
        run: |
          node src/server.js > /tmp/sauti-yetu-api.log 2>&1 &
          api_pid=$!
          cleanup() {
            kill "$api_pid" 2>/dev/null || true
            wait "$api_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4000/health/live >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --show-error http://127.0.0.1:4000/health/live
          curl --fail --show-error http://127.0.0.1:4000/health/ready
